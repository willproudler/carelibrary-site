name: Verify CARE Library beta

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and server dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-server.txt httpx==0.28.1
      - name: Verify the production build
        run: python tools/build-production-site.py
      - name: Prepare catalogue for reader regression tests
        run: |
          node tools/materialize-public-library.mjs
          node tools/build-public-assets.mjs
      - name: Verify reader and navigation
        run: node --test tests/*.test.mjs
      - name: Verify authentication and the private web boundary
        run: python -m unittest discover -s tests -p 'test_production*.py'
      # No Pages artifact or deployment: static hosting bypasses login.
