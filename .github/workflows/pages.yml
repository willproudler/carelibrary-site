name: Publish CARE Library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare small public cover copies
        run: |
          python -m pip install Pillow==12.3.0
          python tools/optimise-covers.py
      - name: Prepare on-demand public readings
        run: node tools/build-public-assets.mjs
      - name: Verify public readings and browser behaviour
        run: node --test tests/*.test.mjs
      - name: Stage public site
        run: |
          mkdir _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='tests/' --exclude='tools/' --exclude='_site/' --exclude='.DS_Store' --exclude='*.md' ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
